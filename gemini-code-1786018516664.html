<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* =========================================================
       NOTION ADAPTIVE COLOR PALETTE & THEME SYSTEM
       ========================================================= */
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f7f6f3;
      --bg-hover: #efeee9;
      --text-primary: #37352f;
      --text-secondary: #787774;
      --border-color: rgba(55, 53, 47, 0.16);
      --accent-color: #2eaadc;
      --pill-bg: rgba(55, 53, 47, 0.08);
      --card-shadow: 0 1px 3px rgba(15, 15, 15, 0.1);
      --radius: 6px;
      --font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #191919;
        --bg-secondary: #202020;
        --bg-hover: #2f2f2f;
        --text-primary: rgba(255, 255, 255, 0.9);
        --text-secondary: rgba(255, 255, 255, 0.44);
        --border-color: rgba(255, 255, 255, 0.13);
        --accent-color: #52baed;
        --pill-bg: rgba(255, 255, 255, 0.08);
        --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      }
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-family);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tracker-container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--card-shadow);
    }

    .notion-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .notion-icon { font-size: 1.8rem; }
    .notion-title { font-size: 1.25rem; font-weight: 600; margin: 0; }
    .notion-subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-top: 2px; }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      .controls-grid { grid-template-columns: 1fr; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    input, select {
      background: var(--bg-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 9px 12px;
      font-size: 0.88rem;
      font-family: var(--font-family);
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
      background: var(--bg-primary);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: var(--card-shadow);
      margin-top: 4px;
      display: none;
    }

    .suggestion-item {
      padding: 8px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .suggestion-item:hover { background: var(--bg-hover); }
    .suggestion-category { font-size: 0.75rem; color: var(--text-secondary); }

    .result-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px;
    }

    .item-name-heading { font-size: 1.15rem; font-weight: 600; margin: 0 0 6px 0; }
    .locality-badge {
      display: inline-block;
      background: var(--pill-bg);
      color: var(--text-primary);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 500;
    }

    .price-display { margin-top: 12px; }
    .main-price { font-size: 2.2rem; font-weight: 700; color: var(--text-primary); }

    .price-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }
  </style>
</head>

    // DOM Elements
    const countrySelect = document.getElementById('countrySelect');
    const regionSelect = document.getElementById('regionSelect');
    const foodInput = document.getElementById('foodInput');
    const suggestions = document.getElementById('suggestions');
    const resItemName = document.getElementById('resItemName');
    const resLocality = document.getElementById('resLocality');
    const resPrice = document.getElementById('resPrice');
    const resCategory = document.getElementById('resCategory');
    const resIndex = document.getElementById('resIndex');

    let currentCountry = 'US';
    let selectedFood = rawCustomFoodItems[4]; // Default to Coca-Cola (Small)

    function updateRegions() {
      currentCountry = countrySelect.value;
      regionSelect.innerHTML = '';
      const regions = countryConfig[currentCountry].regions;
      
      Object.keys(regions).forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        regionSelect.appendChild(option);
      });

      updateDisplay();
    }

    function updateDisplay() {
      const region = regionSelect.value;
      const config = countryConfig[currentCountry];
      const multiplier = config.regions[region] || 1.0;
      
      const rawPrice = selectedFood.base[currentCountry] || selectedFood.base.US;
      const calculatedPrice = (rawPrice * multiplier).toFixed(currentCountry === 'JP' ? 0 : 2);

      resItemName.textContent = selectedFood.name;
      resLocality.textContent = `${region}, ${currentCountry}`;
      resPrice.textContent = `${config.currency}${calculatedPrice}`;
      resCategory.textContent = `Category: ${selectedFood.cat}`;
      resIndex.textContent = `Cost Index: ${(multiplier * 100).toFixed(1)}`;
    }

    foodInput.addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      suggestions.innerHTML = '';

      if (!query) {
        suggestions.style.display = 'none';
        return;
      }

      const matches = rawCustomFoodItems.filter(item => 
        item.name.toLowerCase().includes(query)
      ).slice(0, 15);

      if (matches.length > 0) {
        suggestions.style.display = 'block';
        matches.forEach(item => {
          const div = document.createElement('div');
          div.className = 'suggestion-item';
          div.innerHTML = `<span>${item.name}</span><span class="suggestion-category">${item.cat}</span>`;
          div.addEventListener('click', () => {
            selectedFood = item;
            foodInput.value = item.name;
            suggestions.style.display = 'none';
            updateDisplay();
          });
          suggestions.appendChild(div);
        });
      } else {
        suggestions.style.display = 'none';
      }
    });

    countrySelect.addEventListener('change', updateRegions);
    regionSelect.addEventListener('change', updateDisplay);

    document.addEventListener('click', (e) => {
      if (!foodInput.contains(e.target) && !suggestions.contains(e.target)) {
        suggestions.style.display = 'none';
      }
    });

    // Initialize Widget
    updateRegions();
  </script>
